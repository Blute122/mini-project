[Interface]
# --- RELAY 1: THE ENTRY GUARD (AWS) ---
PrivateKey = <RELAY_1_PRIVATE_KEY>
Address = 10.8.0.1/24
ListenPort = 51820

# Enable IP forwarding and NAT so traffic can exit the AWS node and reach Relay 2 over the internet
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# The Local Client connecting to this Relay
PublicKey = <CLIENT_WG0_PUBLIC_KEY>
AllowedIPs = 10.8.0.2/32
