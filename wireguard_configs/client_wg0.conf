[Interface]
# --- CLIENT OUTER TUNNEL (Connects to AWS) ---
PrivateKey = <CLIENT_WG0_PRIVATE_KEY>
Address = 10.8.0.2/24

[Peer]
# Relay 1 (AWS)
PublicKey = <RELAY_1_PUBLIC_KEY>
Endpoint = <RELAY_1_PUBLIC_IP>:51820

# THE MAGIC: By adding Relay 2's Public IP to the AllowedIPs, wg-quick will natively inject 
# a static route into the OS. This forces the INNER tunnel (wg1) to flow through this OUTER tunnel.
AllowedIPs = <RELAY_2_PUBLIC_IP>/32, 10.8.0.0/24
