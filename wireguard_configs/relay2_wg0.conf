[Interface]
# --- RELAY 2: THE EXIT NODE (DigitalOcean) ---
PrivateKey = <RELAY_2_PRIVATE_KEY>
Address = 10.8.1.1/24
ListenPort = 51820

# Enable IP forwarding and NAT so the final decrypted payload can hit the destination peer
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# The Local Client's INNER tunnel connecting to this Relay (originating from behind Relay 1)
PublicKey = <CLIENT_WG1_PUBLIC_KEY>
AllowedIPs = 10.8.1.2/32
# Note: Endpoint is left blank because the client initiates the connection to us.
