[Interface]
# --- CLIENT INNER TUNNEL (Connects to DigitalOcean) ---
PrivateKey = <CLIENT_WG1_PRIVATE_KEY>
Address = 10.8.1.2/24

[Peer]
# Relay 2 (DigitalOcean)
PublicKey = <RELAY_2_PUBLIC_KEY>

# We target Relay 2's Public IP. Because of wg0's AllowedIPs routing rule, this traffic 
# will be intercepted by wg0, achieving double-encapsulation!
Endpoint = <RELAY_2_PUBLIC_IP>:51820

# Route the actual final destination peer traffic through this inner tunnel.
# Replace <FINAL_PEER_IP> with the specific IP of the peer you are chatting with, 
# or use 0.0.0.0/0 to route all traffic through the Onion.
AllowedIPs = <FINAL_PEER_IP>/32, 10.8.1.0/24
