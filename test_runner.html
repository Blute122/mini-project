<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rufrone - Crypto Test Runner</title>
    <style>
        :root {
            --bg: #0d1117;
            --text: #c9d1d9;
            --border: #30363d;
            --success: #2ea043;
            --panel: #161b22;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.5;
        }

        h1 {
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            color: #58a6ff;
        }

        #output {
            background-color: var(--panel);
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-top: 20px;
            min-height: 100px;
            font-size: 14px;
        }

        .instruction {
            font-size: 0.9em;
            color: #8b949e;
        }
    </style>
</head>

<body>
    <h1>🛡️ Rufrone Crypto Engine Verification</h1>
    <p class="instruction">Executing fully isolated, in-memory cryptographic unit tests utilizing the native
        <code>window.crypto.subtle</code> API. Open your browser's Developer Console (F12) for detailed logs.</p>

    <div id="output">Waiting for Test Suite to load...</div>

    <!-- Load the test suite as a module to resolve standard imports -->
    <script type="module" src="./test_suite.js"></script>
</body>

</html>
